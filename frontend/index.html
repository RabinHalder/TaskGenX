<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>TaskGenX</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236a5cff'/%3E%3Cstop offset='1' stop-color='%2300c2ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='32' fill='url(%23g)'/%3E%3Cpath d='M19 33l9 9 17-20' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    // Set the theme before first paint to avoid a white flash.
    (function () {
      try {
        var p = localStorage.getItem("tgx_theme") || "auto";
        var tgScheme = window.Telegram && Telegram.WebApp && Telegram.WebApp.colorScheme;
        var dark = p === "dark" || (p === "auto" && (tgScheme === "dark" || (!tgScheme && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches)));
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="/shared/theme.css" />
  <link rel="stylesheet" href="/user/user.css" />
  <style>
    #app { padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: calc(var(--nav-h) + 44px + env(safe-area-inset-bottom, 0px)); }
    .bottom-nav { bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
    #toast { top: calc(16px + env(safe-area-inset-top, 0px)); }
  </style>
</head>
<body>

  <!-- Splash screen -->
  <div id="splash">
    <div class="logo-round">
      <svg viewBox="0 0 48 48" width="44" height="44" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M13 25l8 8 15-18"></path>
      </svg>
    </div>
    <div class="splash-name">TaskGenX</div>
    <div class="splash-sub" data-i18n="splash.tagline">Complete tasks. Earn money.</div>
  </div>

  <!-- Panels (filled by JavaScript) -->
  <div id="app">
    <div id="user-root"></div>
    <div id="admin-root" class="hidden"></div>
  </div>

  <!-- Floating glass bottom navigation -->
  <nav class="bottom-nav hidden" id="user-nav"></nav>
  <nav class="bottom-nav hidden" id="admin-nav"></nav>

  <div id="toast" role="status" aria-live="polite"></div>
  <canvas id="confetti"></canvas>

  <!-- Shared scripts (order matters) -->
  <script src="/shared/i18n.js"></script>
  <script src="/shared/ui.js"></script>
  <script src="/shared/api.js"></script>

  <!-- User panel (added in batch 2). The admin panel loads itself later, only for admins. -->
  <script src="/user/home.js"></script>
  <script src="/user/club.js"></script>
  <script src="/user/task.js"></script>
  <script src="/user/referral.js"></script>
  <script src="/user/profile.js"></script>
  <script src="/user/app.js"></script>
</body>
</html>
